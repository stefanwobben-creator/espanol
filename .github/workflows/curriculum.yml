# De avondrun: onderhoudt het leerpad. Draait ná het ophalen van het logboek (logboek.yml, 01:30 UTC),
# zodat hij met verse foutgegevens werkt.
#
# Twee soorten uitkomst, bewust verschillend behandeld (keuze Stefan, 3 augustus):
#   - gaten dichten (extra oefenzinnen, een extra grammatica-toetsje) → gaat direct live
#   - een compleet nieuwe les, zeker op B1-niveau → komt als pull request, jij tikt op akkoord
#
# Sinds de poort bestaat (zie poort.yml) draait deze run de regressiekern twee keer: één keer vóór
# hij iets schrijft, om te weten of main al groen was, en één keer over zijn eigen resultaat. Alleen
# bij groen wordt er gepusht. De push zelf komt daarna nog een derde keer langs de poort, want
# poort.yml draait op elke push naar main; dat is dubbelop maar het kost niets en het houdt de regel
# simpel: er is precies één weg naar live.
#
# 13 AUGUSTUS: DRIE STRUCTURELE REPARATIES
#
# Stefan: "avondrun gaat niet goed en doe ik in github re-run jobs dan gaat het wel goed. fix it
# structureel." Wat er aan de hand was, in volgorde van hoe erg:
#
#   1. Een re-run is geen herkansing maar een nieuwe worp. "Re-run all jobs" draait curriculum.js
#      opnieuw, en die vraagt een taalmodel om nieuwe zinnen. De run was dus een machine die je 's
#      ochtends met de hand moest aanzwengelen. tools/avondrun.sh doet die tweede worp nu zelf,
#      hoogstens één keer.
#   2. Het bewijs werd weggegooid. De stap "Kapotte poging bewaren" kopieerde de mislukte poging naar
#      /tmp/mislukt en er stond nergens een upload-artifact. Die map gaat met de runner de prullenbak
#      in. De stap die het bewijs moest bewaren, gooide het dus weg, en 's ochtends was de enige
#      informatie "er is niets gepusht".
#   3. De hartslag loog. curriculum.js schrijft `gelukt` als hij klaar is met genereren, niet als er
#      iets gepubliceerd is. Twee nachten op rij (12 en 13 aug) stond er "gelukt: true, geleverd:
#      5 zinnen" terwijl er niets op main stond. tools/hartslag-af.js zet er nu de uitkomst van de
#      héle run in.
#
# Benodigd secret: ADMIN_KEY — hetzelfde secret dat logboek.yml al gebruikt. De LLM-ladder en de
# LLM-sleutels staan namelijk op de server (Render), niet hier; de run leent die via
# POST /api/admin/llm. Zo staan de sleutels op één plek en hoeft er niets gedupliceerd te worden.
# Ontbreekt ADMIN_KEY, dan stopt de run netjes na de analyse en wordt er niets gewijzigd.
name: Avondrun curriculum
on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC, een half uur na het logboek
  workflow_dispatch:
    inputs:
      nieuwe_les:
        description: "Ook een nieuwe les maken (ook als de voorraad nog niet krap is)"
        type: boolean
        default: false
      droog:
        description: "Alleen kijken, niets wegschrijven"
        type: boolean
        default: false

# Twee runs door elkaar zouden dezelfde ids kunnen uitdelen; dus één tegelijk.
concurrency:
  group: curriculum
  cancel-in-progress: false

env:
  # Een GitHub-runner heeft twee kernen. Met de standaard van vier browsers vecht de poort met
  # zichzelf om processortijd en lopen suites tegen hun eigen tijdslimiet aan; dat is precies het
  # soort rood dat bij een re-run vanzelf weggaat en waar je dus niets van leert. poort.yml heeft
  # dit probleem niet omdat die de suites over vier machines verdeelt.
  TEGELIJK: 2

jobs:
  curriculum:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 28 augustus: waar stond main toen wij begonnen? Zonder dit punt kan de stap onderaan niet
      # zien of er tijdens de run iemand anders heeft gepubliceerd.
      - name: Waar main stond bij de start
        id: start
        run: echo "hoofd=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Analyse (altijd, ook zonder sleutel)
        run: node tools/curriculum.js --analyse

      # v23.178: no-undef op tools/. Dit had de nachten van 21 en 22 augustus voorkomen, waar de
      # run klapte op een `oud` die in die functie nooit gedeclareerd was. node --check ziet dat
      # niet, want het is geldige JavaScript.
      - name: Ongedeclareerde namen in tools/
        run: |
          npm install --no-audit --no-fund --silent
          npm run lint

      - name: Zelftest van de contentbibliotheek
        run: node tools/content-lib.js --zelftest

      # v23.177: de zeef is de reparatie van de nacht die op 23 augustus klapte, en dus hoort
      # er een controle bij die rood wordt zodra hij niet meer werkt. Hij draait met precies
      # de twee zinnen die run #25 lieten stranden.
      - name: Zelftest van de zeef
        run: node tools/curriculum.js --zelftest

      # 28 augustus: de regel die bepaalt of een klapper een tweede worp krijgt. Zie de kop van
      # tools/avondrun-herkansing.js: dat onderscheid liep vijf nachten om de herkansing heen.
      - name: Zelftest van de herkansing
        run: node tools/avondrun-herkansing.js --zelftest

      # v23.239: de stap die de lading op verse main legt. Hij staat hier tussen de zelftests omdat
      # hij vanaf nu het enige pad naar main is voor de inhoud van de nacht, en omdat zijn proeven
      # vooral bewijzen dat hij KAN stranden: een publicatiestap die alles doorlaat is geen stap.
      - name: Zelftest van de lading
        run: node tools/curriculum-toepassen.js --zelftest

      # 31 augustus: de levering zelf. Deze proef bouwt een echt kaal repository, laat main eronder
      # vandaan bewegen zoals de logboek-Action elke nacht doet, en levert dan af. Hij staat hier
      # tussen de andere zelftests omdat het afleveren acht nachten lang de stille blokkade was:
      # er werd wél gegenereerd en wél ingesproken, en het kwam alleen nooit op main.
      - name: Zelftest van de levering
        run: sh tools/avondrun-leveren.sh --zelftest

      # v23.179: de samenvoeging van het manifest. Zonder deze stap kan de regel "main wint waar
      # main een regel heeft" ongemerkt omklappen, en dan overschrijft de nachtrun de beschrijving
      # van een mp3 die hij zelf net heeft teruggezet.
      - name: Zelftest van de manifestsamenvoeging
        run: node tools/stemmen-samenvoegen.js --zelftest

      # v23.183: elke leesreeks met geluid noemt zijn eigen verteller. Deze stap wordt rood
      # zodra er een boek bij komt zonder stem, mét de naam van de reeks erbij. Dat is de hele
      # reden dat hij er is: bij v23.181 en v23.182 stond in de patchkop dat er geen stem was
      # gekozen, en een afspraak die alleen in een patchkop staat gaat de derde keer weer mis.
      - name: Zelftest van de stem per reeks
        run: node tools/audio-lib.js --zelftest

      # De poort staat hier al klaar, nog vóór de bot iets schrijft. Zo weet je zeker dat een rode
      # avondrun niet aan een al kapotte main ligt: was het hier al rood, dan is het niet zijn schuld.
      - name: Playwright installeren
        working-directory: test
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Poort vooraf (staat main groen?)
        id: vooraf
        continue-on-error: true
        run: node test/poort.js

      - name: Stond main al rood?
        if: steps.vooraf.outcome == 'failure'
        run: |
          echo "::warning::De poort was al rood op main vóórdat de avondrun iets deed. Wat hierna misgaat, is niet per se van de bot."
          echo "### De poort stond vooraf al rood op main" >> $GITHUB_STEP_SUMMARY

      # Genereren en keuren zitten in één script, want ze horen bij elkaar: een afgekeurde poging
      # wordt teruggedraaid en er volgt een nieuwe worp. Zie de kop van tools/avondrun.sh.
      - name: Genereren en keuren (hoogstens twee pogingen)
        id: run
        continue-on-error: true
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "ADMIN_KEY-secret ontbreekt, dus er valt vannacht niets te genereren."
            echo "Dat is een mislukte run en geen geslaagde; logboek.yml doet hier hetzelfde."
            echo "wat=geen-sleutel" >> $GITHUB_OUTPUT
            exit 1
          fi
          VLAGGEN=""
          [ "${{ inputs.droog }}" = "true" ] && VLAGGEN="$VLAGGEN --droog"
          [ "${{ inputs.nieuwe_les }}" = "true" ] && VLAGGEN="$VLAGGEN --nieuwe-les"
          sh tools/avondrun.sh "$VLAGGEN"

      # 13 AUGUSTUS: DE RUN SPREEKT ZIJN EIGEN ZINNEN IN
      #
      # Stefan: "hij moet ook eleven labs gebruiken om de zinnen in te spreken." Tot vandaag deed
      # niets dat. audio/dictado/ stond sinds 30 juli stil op 201 bestanden terwijl er 50 zinnen
      # bij waren gekomen; op 20% van het corpus deed de "Hoor hem"-knop dus niets, en niets zei
      # dat. Zie de kop van tools/avondrun-audio.js.
      #
      # Ná de poort, met opzet: dan kost een afgekeurde poging geen tekens. Wordt er afgekeurd, dan
      # staat de tekst terug op die van main en spreekt deze stap gewoon de achterstand in. Faalt
      # hij zelf, dan gaat het publiceren door: de tekst is het leermateriaal en het geluid is de
      # garnering. Vandaar continue-on-error én een script dat op 0 eindigt.
      - name: De nieuwe zinnen inspreken
        id: audio
        if: always() && steps.run.outputs.wat != 'geen-sleutel'
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::warning::ELEVENLABS_API_KEY-secret ontbreekt, dus er wordt niets ingesproken."
            echo "De zinnen gaan wel live; de app valt bij een ontbrekend bestand terug op de browserstem."
            echo "audio=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          # 14 augustus: eerst kijken wat er intussen op main staat.
          #
          # Run #14 liep hier op stuk. Een re-run checkt de commit uit waarmee de run begon, dus de
          # stand van vóór de push van de eerste poging. De 92 mp3's die poging 1 al had ingesproken
          # en gepubliceerd stonden niet in de werkmap, en het overslaan kijkt naar de werkmap.
          # Gevolg: alles nog een keer ingesproken (tekens weg) en daarna een botsing bij het pushen,
          # want twee opnames van dezelfde zin zijn nooit byte-gelijk.
          #
          # Wat al gepubliceerd is, wint. Bestanden die alleen hier bestaan blijven staan.
          git fetch origin main --quiet || true
          git checkout FETCH_HEAD -- audio 2>/dev/null || true
          node tools/avondrun-audio.js

      # Dít ontbrak. Zonder deze stap staat het bewijs van een afgekeurde nacht op een machine die
      # daarna wordt opgeruimd.
      - name: Afgekeurde pogingen bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avondrun-afgekeurd-${{ github.run_id }}
          path: ${{ runner.temp }}/mislukt
          retention-days: 14
          if-no-files-found: ignore

      # Vóór het publiceren, want de publicatiestap commit de hartslag mee. Zo staat er één commit
      # met de juiste meting in plaats van twee waarvan de eerste nog de oude betekenis draagt.
      - name: Hartslag afmaken
        if: always()
        run: |
          STATUS=geklapt
          case "${{ steps.run.outputs.wat }}" in
            reparatie)    STATUS=gepubliceerd ;;
            nieuwe-les)   STATUS=pull-request ;;
            niets)        STATUS=niets-te-doen ;;
            afgekeurd)    STATUS=poort-dicht ;;
            geen-sleutel) STATUS=geen-sleutel ;;
          esac
          node tools/hartslag-af.js "$STATUS" "${{ steps.run.outputs.pogingen || 1 }}"
          {
            echo "### Hartslag"
            echo ""
            echo '```json'
            cat tools/avondrun-hart.json
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Reparatie direct live
        if: steps.run.outputs.wat == 'reparatie'
        run: |
          git config user.name "curriculum-bot"
          git config user.email "actions@users.noreply.github.com"
          SAMENVATTING=$(node -e "
            const p = require('./tools/curriculum-laatste.json');
            const g = (p.gaten||[]).map(x => x.tag).join(', ');
            const z = (p.reparatie.zinnen||[]).length, t = (p.reparatie.toetsjes||[]).length;
            console.log(\`\${z} oefenzinnen\${t ? ' en ' + t + ' toetsje(s)' : ''} bij: \${g}\`);
          ")
          # audio/ hoort hierbij: de mp3's van de zinnen die in deze commit zitten. Los committen
          # zou een moment opleveren waarop de zin op main staat en de opname niet.
          # audio/ hoort in dezelfde commit: los committen zou een moment opleveren waarop de zin
          # op main staat en de opname niet, en dat is precies de toestand die we aan het opruimen
          # zijn. De telling erbij, zodat je aan de commitregel ziet of er is ingesproken.
          OPNAMES="${{ steps.audio.outputs.audio }}"
          if [ -n "$OPNAMES" ] && [ "$OPNAMES" != "0" ]; then
            SAMENVATTING="$SAMENVATTING (+$OPNAMES opnames)"
          fi
          # v23.239: via avondrun-leveren.sh, net als de hartslag sinds 31 augustus. Hier stond een
          # kale commit-en-push op de main van drie uur geleden, en die wordt geweigerd zodra de
          # logboek-Action of Stefan er ondertussen overheen is gegaan. Gevolg: de hele nacht viel
          # weg, en dat is de veilige helft van fout.
          #
          # index.html gaat niet als bestand mee maar als lading (zie het uitzonderingsgeval in dat
          # script): verse main pakken, de zinnen erop leggen, en het versienummer pas dan kiezen.
          # versie.txt staat er wel bij, want hij moet mee de commit in, maar hij wordt niet
          # gekopieerd: het toepassen schrijft hem, van wat er op verse main stond.
          sh tools/avondrun-leveren.sh "avondrun: $SAMENVATTING" \
            index.html versie.txt tools/curriculum-laatste.json tools/avondrun-hart.json audio

      - name: Nieuwe les als pull request
        if: steps.run.outputs.wat == 'nieuwe-les'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "curriculum-bot"
          git config user.email "actions@users.noreply.github.com"
          TAK="curriculum/les-$(date +%Y%m%d)"
          git checkout -b "$TAK"
          git add index.html versie.txt tools/curriculum-laatste.json audio
          git commit -m "curriculum: nieuwe les \"${{ steps.run.outputs.titel }}\""
          git push -u origin "$TAK"
          # De kop van de PR komt uit het plan (één regel node, geen meerregelige JS: die liep uit het
          # YAML-blok en dan kan GitHub het workflowbestand niet meer lezen).
          node -e "const l=require('./tools/curriculum-laatste.json').nieuweLes; console.log(['## Nieuwe les: '+l.titel,'','Niveau **'+l.niveau+'**, les '+l.num+' in het pad.','','- '+l.words.length+' woorden','- '+l.sents.length+' oefenzinnen','- '+(l.quizzes||[]).length+' grammatica-toetsje(s)','- eigen spiekbriefkaart',''].join(String.fromCharCode(10)))" > /tmp/pr.md
          cat >> /tmp/pr.md <<'MD'
          Gemaakt door de avondrun en nagelezen door een tweede model (Spaans, vertaling, uitleg, en of
          er precies een goed antwoord is). De machinecontroles zitten in tools/content-lib.js: unieke
          ids, verplichte velden, geldige spiek-index, antwoordindex binnen bereik, en na het schrijven
          een hertelling van alle vier de contentlijsten.

          Wat te doen: lees de zinnen en de spiekbrief even door. Klopt het, dan mergen. De les staat
          achter je huidige lessen en gaat pas open als je die af hebt.
          MD
          gh pr create --title "Nieuwe les: ${{ steps.run.outputs.titel }}" --body-file /tmp/pr.md --base main --head "$TAK"

      - name: Niets veranderd
        if: steps.run.outputs.wat == 'niets'
        run: |
          echo "Er is niets weggeschreven. Wat de run daar zelf over zegt:"
          cat tools/avondrun-hart.json

      # De hartslag staat er ook als er niets is gepubliceerd; juist dan. Zonder dit bestand is de
      # enige manier om te zien of de avondrun ooit iets deed: commits van de bot tellen, en dat is
      # geen meting maar archeologie.
      #
      # En audio hoort hier ook thuis, want dit is de enige commitstap die altijd draait. Was er
      # niets te dichten (wat=niets) of ging de poort dicht (wat=afgekeurd), dan is er geen
      # publicatiestap, maar de achterstand aan opnames is er dan nog steeds. Publiceerde de
      # reparatiestap hierboven de audio al, dan valt er hier gewoon niets meer toe te voegen.
      # DE HARTSLAG EN DE OPNAMES OP MAIN KRIJGEN
      #
      # Hier stond een blok van veertig regels shell dat eindigde op `git pull --rebase` en dan
      # `git push`. Die rebase mislukte acht nachten op rij (23 t/m 30 augustus), waarna de stap met
      # een ::warning:: en exitcode 0 eindigde. Groen dus, en de hartslag en de opnames van die
      # nacht bleven liggen. Gemeten gevolg: avondrun-hart.json stond acht dagen stil, en er is elke
      # nacht voor ongeveer 18.500 ElevenLabs-tekens ingesproken dat daarna is weggegooid.
      #
      # Wat deze stap wil afleveren zijn geen commits maar bestanden, en voor bestanden is rebasen
      # het verkeerde gereedschap: op deze main publiceren drie schrijvers, en de logboek-Action
      # wordt door GitHub steeds later ingepland (van 02:30 naar 13:01), dus main verschuift
      # tegenwoordig middenin het venster van de avondrun.
      #
      # tools/avondrun-leveren.sh zet de lading apart, pakt verse main, legt de bestanden erop,
      # committeert één keer en pusht. Geweigerd omdat iemand er ondertussen overheen ging? Dan
      # opnieuw met nog versere main, drie pogingen. De foutregel van git gaat mee de melding in en
      # het script eindigt op 1, want een levering die stil wegvalt en groen blijft is precies hoe
      # dit acht nachten kon duren. De proef staat in het script zelf en draait hierboven mee.
      - name: Hartslag en audio wegschrijven
        if: always()
        run: |
          [ -f tools/avondrun-hart.json ] || exit 0
          git config user.name "curriculum-bot"
          git config user.email "actions@users.noreply.github.com"
          REGEL="avondrun: hartslag $(node -e "const h=require('./tools/avondrun-hart.json'); console.log(h.gepubliceerd ? 'geleverd' : 'niets geleverd (' + (h.reden||'geen reden') + ')')")"
          sh tools/avondrun-leveren.sh "$REGEL" tools/avondrun-hart.json audio

      # 28 AUGUSTUS: DE HARTSLAG MOET ERGENS STAAN WAAR HIJ NIET KAN VERDWIJNEN
      #
      # De hartslag is het enige kanaal waarlangs deze run vertelt wat er misging, en hij hing tot nu
      # toe volledig aan een push. Die push zat achter `git pull --rebase`, en als die rebase mislukte
      # eindigde de stap met een ::warning:: en exitcode 0: groen, en de hartslag bleef liggen.
      # Gemeten op 28 augustus: tools/avondrun-hart.json op main dateerde van 23 augustus, terwijl er
      # sindsdien vijf runs waren. Op 31 augustus waren dat er acht, en toen is de rebase vervangen
      # door tools/avondrun-leveren.sh (v23.217).
      #
      # Die vervanging maakt deze stap niet overbodig, integendeel. Ook een levering die drie keer
      # opnieuw probeert kan uiteindelijk falen, en dan hoort de reden nog steeds ergens te staan
      # waar hij niet aan een push hangt.
      #
      # Een meldkanaal dat stil kan wegvallen is geen meldkanaal. De samenvatting van de run staat
      # altijd op de pagina van die run, hangt aan niets, en overleeft elke mislukte push.
      - name: Hartslag in de samenvatting
        if: always()
        run: |
          {
            echo "## Hartslag van deze run"
            echo ""
            echo '```json'
            cat tools/avondrun-hart.json 2>/dev/null || echo '{"reden":"curriculum.js heeft geen hartslag weggeschreven"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 28 AUGUSTUS: HEEFT IEMAND ANDERS ONDERTUSSEN GEPUBLICEERD?
      #
      # Er bleken twee nachtsystemen op deze repo te werken: deze Action (committer curriculum-bot)
      # en een geplande Claude-taak van 22 juli (committer claude-nachttaak / "Claude (nachtrun)").
      # De taak draaide om 02:00 UTC, deze Action om 02:50, allebei met dezelfde opdracht. Niemand
      # merkte dat deze Action stukstond, want de inhoud verscheen toch wel: door de ander.
      #
      # Twee systemen die hetzelfde doen is de fout, en die is opgelost door de taak uit te zetten.
      # Deze stap is de bewaking eromheen: verschijnt er tijdens de run een commit op main die niet
      # van deze Action is, dan hoort dat op het scherm te staan in plaats van zich te uiten als een
      # onverklaarbare rode run.
      - name: Is main onder ons verschoven?
        if: always()
        run: |
          git fetch origin main --quiet || exit 0
          NU=$(git rev-parse FETCH_HEAD)
          if [ "$NU" != "${{ steps.start.outputs.hoofd }}" ]; then
            ANDER=$(git log --format='%an: %s' "${{ steps.start.outputs.hoofd }}..$NU" 2>/dev/null | grep -v 'curriculum-bot' | head -5)
            if [ -n "$ANDER" ]; then
              echo "::warning::main is tijdens deze run verschoven door iemand anders:"
              echo "$ANDER"
              {
                echo "## Let op: main verschoof tijdens deze run"
                echo ""
                echo "Er is gepubliceerd door iets anders dan deze Action:"
                echo ""
                echo '```'
                echo "$ANDER"
                echo '```'
                echo ""
                echo "Twee systemen die dezelfde repo onderhouden verklaren rode runs die verder nergens op slaan."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # Pas hier valt de run om. Alles hierboven heeft dan zijn werk gedaan: het bewijs is bewaard,
      # de hartslag staat op main, en de samenvatting vertelt welke suites rood waren.
      - name: Rood afsluiten als er niets gepubliceerd is
        if: steps.run.outcome == 'failure'
        run: |
          echo "De avondrun heeft niets gepubliceerd (${{ steps.run.outputs.wat }})."
          # 28 augustus: hier stond alleen "kijk in het artefact", en het artefact is precies wat
          # niemand opent. De reden staat in de hartslag en die is één regel; die hoort hier.
          node -e "try{const h=require('./tools/avondrun-hart.json');console.log('Reden: '+(h.reden||'geen reden opgeschreven'));if(h.mis)console.log('Beloofd en niet geleverd: '+h.mis.join(', '));if(h.kaalVerloop)console.log('Kale zinnen: '+JSON.stringify(h.kaalVerloop));}catch(e){console.log('Geen hartslag: curriculum.js is niet aan zijn slotregel toegekomen.')}"
          echo "De hele hartslag en het spoor van elke poging staan in de samenvatting van deze run."
          exit 1
