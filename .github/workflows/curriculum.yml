# De avondrun: onderhoudt het leerpad. Draait ná het ophalen van het logboek (logboek.yml, 01:30 UTC),
# zodat hij met verse foutgegevens werkt.
#
# Twee soorten uitkomst, bewust verschillend behandeld (keuze Stefan, 3 augustus):
#   - gaten dichten (extra oefenzinnen, een extra grammatica-toetsje) → gaat direct live
#   - een compleet nieuwe les, zeker op B1-niveau → komt als pull request, jij tikt op akkoord
#
# Sinds de poort bestaat (zie poort.yml) draait deze run de regressiekern twee keer: één keer vóór
# hij iets schrijft, om te weten of main al groen was, en één keer over zijn eigen resultaat. Alleen
# bij groen wordt er gepusht. De push zelf komt daarna nog een derde keer langs de poort, want
# poort.yml draait op elke push naar main; dat is dubbelop maar het kost niets en het houdt de regel
# simpel: er is precies één weg naar live.
#
# 13 AUGUSTUS: DRIE STRUCTURELE REPARATIES
#
# Stefan: "avondrun gaat niet goed en doe ik in github re-run jobs dan gaat het wel goed. fix it
# structureel." Wat er aan de hand was, in volgorde van hoe erg:
#
#   1. Een re-run is geen herkansing maar een nieuwe worp. "Re-run all jobs" draait curriculum.js
#      opnieuw, en die vraagt een taalmodel om nieuwe zinnen. De run was dus een machine die je 's
#      ochtends met de hand moest aanzwengelen. tools/avondrun.sh doet die tweede worp nu zelf,
#      hoogstens één keer.
#   2. Het bewijs werd weggegooid. De stap "Kapotte poging bewaren" kopieerde de mislukte poging naar
#      /tmp/mislukt en er stond nergens een upload-artifact. Die map gaat met de runner de prullenbak
#      in. De stap die het bewijs moest bewaren, gooide het dus weg, en 's ochtends was de enige
#      informatie "er is niets gepusht".
#   3. De hartslag loog. curriculum.js schrijft `gelukt` als hij klaar is met genereren, niet als er
#      iets gepubliceerd is. Twee nachten op rij (12 en 13 aug) stond er "gelukt: true, geleverd:
#      5 zinnen" terwijl er niets op main stond. tools/hartslag-af.js zet er nu de uitkomst van de
#      héle run in.
#
# Benodigd secret: ADMIN_KEY — hetzelfde secret dat logboek.yml al gebruikt. De LLM-ladder en de
# LLM-sleutels staan namelijk op de server (Render), niet hier; de run leent die via
# POST /api/admin/llm. Zo staan de sleutels op één plek en hoeft er niets gedupliceerd te worden.
# Ontbreekt ADMIN_KEY, dan stopt de run netjes na de analyse en wordt er niets gewijzigd.
name: Avondrun curriculum
on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC, een half uur na het logboek
  workflow_dispatch:
    inputs:
      nieuwe_les:
        description: "Ook een nieuwe les maken (ook als de voorraad nog niet krap is)"
        type: boolean
        default: false
      droog:
        description: "Alleen kijken, niets wegschrijven"
        type: boolean
        default: false

# Twee runs door elkaar zouden dezelfde ids kunnen uitdelen; dus één tegelijk.
concurrency:
  group: curriculum
  cancel-in-progress: false

env:
  # Een GitHub-runner heeft twee kernen. Met de standaard van vier browsers vecht de poort met
  # zichzelf om processortijd en lopen suites tegen hun eigen tijdslimiet aan; dat is precies het
  # soort rood dat bij een re-run vanzelf weggaat en waar je dus niets van leert. poort.yml heeft
  # dit probleem niet omdat die de suites over vier machines verdeelt.
  TEGELIJK: 2

jobs:
  curriculum:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Analyse (altijd, ook zonder sleutel)
        run: node tools/curriculum.js --analyse

      - name: Zelftest van de contentbibliotheek
        run: node tools/content-lib.js --zelftest

      # De poort staat hier al klaar, nog vóór de bot iets schrijft. Zo weet je zeker dat een rode
      # avondrun niet aan een al kapotte main ligt: was het hier al rood, dan is het niet zijn schuld.
      - name: Playwright installeren
        working-directory: test
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Poort vooraf (staat main groen?)
        id: vooraf
        continue-on-error: true
        run: node test/poort.js

      - name: Stond main al rood?
        if: steps.vooraf.outcome == 'failure'
        run: |
          echo "::warning::De poort was al rood op main vóórdat de avondrun iets deed. Wat hierna misgaat, is niet per se van de bot."
          echo "### De poort stond vooraf al rood op main" >> $GITHUB_STEP_SUMMARY

      # Genereren en keuren zitten in één script, want ze horen bij elkaar: een afgekeurde poging
      # wordt teruggedraaid en er volgt een nieuwe worp. Zie de kop van tools/avondrun.sh.
      - name: Genereren en keuren (hoogstens twee pogingen)
        id: run
        continue-on-error: true
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "ADMIN_KEY-secret ontbreekt, dus er valt vannacht niets te genereren."
            echo "Dat is een mislukte run en geen geslaagde; logboek.yml doet hier hetzelfde."
            echo "wat=geen-sleutel" >> $GITHUB_OUTPUT
            exit 1
          fi
          VLAGGEN=""
          [ "${{ inputs.droog }}" = "true" ] && VLAGGEN="$VLAGGEN --droog"
          [ "${{ inputs.nieuwe_les }}" = "true" ] && VLAGGEN="$VLAGGEN --nieuwe-les"
          sh tools/avondrun.sh "$VLAGGEN"

      # 13 AUGUSTUS: DE RUN SPREEKT ZIJN EIGEN ZINNEN IN
      #
      # Stefan: "hij moet ook eleven labs gebruiken om de zinnen in te spreken." Tot vandaag deed
      # niets dat. audio/dictado/ stond sinds 30 juli stil op 201 bestanden terwijl er 50 zinnen
      # bij waren gekomen; op 20% van het corpus deed de "Hoor hem"-knop dus niets, en niets zei
      # dat. Zie de kop van tools/avondrun-audio.js.
      #
      # Ná de poort, met opzet: dan kost een afgekeurde poging geen tekens. Wordt er afgekeurd, dan
      # staat de tekst terug op die van main en spreekt deze stap gewoon de achterstand in. Faalt
      # hij zelf, dan gaat het publiceren door: de tekst is het leermateriaal en het geluid is de
      # garnering. Vandaar continue-on-error én een script dat op 0 eindigt.
      - name: De nieuwe zinnen inspreken
        id: audio
        if: always() && steps.run.outputs.wat != 'geen-sleutel'
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::warning::ELEVENLABS_API_KEY-secret ontbreekt, dus er wordt niets ingesproken."
            echo "De zinnen gaan wel live; de app valt bij een ontbrekend bestand terug op de browserstem."
            echo "audio=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          node tools/avondrun-audio.js

      # Dít ontbrak. Zonder deze stap staat het bewijs van een afgekeurde nacht op een machine die
      # daarna wordt opgeruimd.
      - name: Afgekeurde pogingen bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avondrun-afgekeurd-${{ github.run_id }}
          path: ${{ runner.temp }}/mislukt
          retention-days: 14
          if-no-files-found: ignore

      # Vóór het publiceren, want de publicatiestap commit de hartslag mee. Zo staat er één commit
      # met de juiste meting in plaats van twee waarvan de eerste nog de oude betekenis draagt.
      - name: Hartslag afmaken
        if: always()
        run: |
          STATUS=geklapt
          case "${{ steps.run.outputs.wat }}" in
            reparatie)    STATUS=gepubliceerd ;;
            nieuwe-les)   STATUS=pull-request ;;
            niets)        STATUS=niets-te-doen ;;
            afgekeurd)    STATUS=poort-dicht ;;
            geen-sleutel) STATUS=geen-sleutel ;;
          esac
          node tools/hartslag-af.js "$STATUS" "${{ steps.run.outputs.pogingen || 1 }}"
          {
            echo "### Hartslag"
            echo ""
            echo '```json'
            cat tools/avondrun-hart.json
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Reparatie direct live
        if: steps.run.outputs.wat == 'reparatie'
        run: |
          git config user.name "curriculum-bot"
          git config user.email "actions@users.noreply.github.com"
          SAMENVATTING=$(node -e "
            const p = require('./tools/curriculum-laatste.json');
            const g = (p.gaten||[]).map(x => x.tag).join(', ');
            const z = (p.reparatie.zinnen||[]).length, t = (p.reparatie.toetsjes||[]).length;
            console.log(\`\${z} oefenzinnen\${t ? ' en ' + t + ' toetsje(s)' : ''} bij: \${g}\`);
          ")
          # audio/ hoort hierbij: de mp3's van de zinnen die in deze commit zitten. Los committen
          # zou een moment opleveren waarop de zin op main staat en de opname niet.
          # audio/ hoort in dezelfde commit: los committen zou een moment opleveren waarop de zin
          # op main staat en de opname niet, en dat is precies de toestand die we aan het opruimen
          # zijn. De telling erbij, zodat je aan de commitregel ziet of er is ingesproken.
          OPNAMES="${{ steps.audio.outputs.audio }}"
          if [ -n "$OPNAMES" ] && [ "$OPNAMES" != "0" ]; then
            SAMENVATTING="$SAMENVATTING (+$OPNAMES opnames)"
          fi
          git add index.html versie.txt tools/curriculum-laatste.json tools/avondrun-hart.json audio
          git commit -m "avondrun: $SAMENVATTING"
          git push

      - name: Nieuwe les als pull request
        if: steps.run.outputs.wat == 'nieuwe-les'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "curriculum-bot"
          git config user.email "actions@users.noreply.github.com"
          TAK="curriculum/les-$(date +%Y%m%d)"
          git checkout -b "$TAK"
          git add index.html versie.txt tools/curriculum-laatste.json audio
          git commit -m "curriculum: nieuwe les \"${{ steps.run.outputs.titel }}\""
          git push -u origin "$TAK"
          # De kop van de PR komt uit het plan (één regel node, geen meerregelige JS: die liep uit het
          # YAML-blok en dan kan GitHub het workflowbestand niet meer lezen).
          node -e "const l=require('./tools/curriculum-laatste.json').nieuweLes; console.log(['## Nieuwe les: '+l.titel,'','Niveau **'+l.niveau+'**, les '+l.num+' in het pad.','','- '+l.words.length+' woorden','- '+l.sents.length+' oefenzinnen','- '+(l.quizzes||[]).length+' grammatica-toetsje(s)','- eigen spiekbriefkaart',''].join(String.fromCharCode(10)))" > /tmp/pr.md
          cat >> /tmp/pr.md <<'MD'
          Gemaakt door de avondrun en nagelezen door een tweede model (Spaans, vertaling, uitleg, en of
          er precies een goed antwoord is). De machinecontroles zitten in tools/content-lib.js: unieke
          ids, verplichte velden, geldige spiek-index, antwoordindex binnen bereik, en na het schrijven
          een hertelling van alle vier de contentlijsten.

          Wat te doen: lees de zinnen en de spiekbrief even door. Klopt het, dan mergen. De les staat
          achter je huidige lessen en gaat pas open als je die af hebt.
          MD
          gh pr create --title "Nieuwe les: ${{ steps.run.outputs.titel }}" --body-file /tmp/pr.md --base main --head "$TAK"

      - name: Niets veranderd
        if: steps.run.outputs.wat == 'niets'
        run: |
          echo "Er is niets weggeschreven. Wat de run daar zelf over zegt:"
          cat tools/avondrun-hart.json

      # De hartslag staat er ook als er niets is gepubliceerd; juist dan. Zonder dit bestand is de
      # enige manier om te zien of de avondrun ooit iets deed: commits van de bot tellen, en dat is
      # geen meting maar archeologie.
      #
      # En audio hoort hier ook thuis, want dit is de enige commitstap die altijd draait. Was er
      # niets te dichten (wat=niets) of ging de poort dicht (wat=afgekeurd), dan is er geen
      # publicatiestap, maar de achterstand aan opnames is er dan nog steeds. Publiceerde de
      # reparatiestap hierboven de audio al, dan valt er hier gewoon niets meer toe te voegen.
      - name: Hartslag en audio wegschrijven
        if: always()
        run: |
          [ -f tools/avondrun-hart.json ] || exit 0
          git config user.name "curriculum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/avondrun-hart.json audio
          if git diff --cached --quiet; then echo "hartslag en audio ongewijzigd"; exit 0; fi
          git commit -m "avondrun: hartslag $(node -e "const h=require('./tools/avondrun-hart.json'); console.log(h.gepubliceerd ? 'geleverd' : 'niets geleverd (' + (h.reden||'geen reden') + ')')")"
          git pull --rebase --autostash
          git push

      # Pas hier valt de run om. Alles hierboven heeft dan zijn werk gedaan: het bewijs is bewaard,
      # de hartslag staat op main, en de samenvatting vertelt welke suites rood waren.
      - name: Rood afsluiten als er niets gepubliceerd is
        if: steps.run.outcome == 'failure'
        run: |
          echo "De avondrun heeft niets gepubliceerd (${{ steps.run.outputs.wat }})."
          echo "Het spoor van elke afgekeurde poging staat als artefact bij deze run."
          exit 1
