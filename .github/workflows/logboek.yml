# Haalt elke nacht de fouten- en liedlogs van de server en zet ze in de repo,
# zodat de nachtelijke content-taak (die de API niet kan bereiken) ze kan lezen.
# Vereist repo-secret ADMIN_KEY (Settings → Secrets and variables → Actions).
name: Logboek ophalen
on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC, ruim vóór de content-taak van 02:00
  workflow_dispatch: {}
jobs:
  logboek:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Logs ophalen van de server
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then echo "ADMIN_KEY-secret ontbreekt"; exit 1; fi
          mkdir -p tools
          curl -sf --get "https://espanol-qbm8.onrender.com/api/logs" \
            --data-urlencode "key=${ADMIN_KEY}" --data "dagen=3" \
            -o tools/logs-latest.json
          echo "Opgehaald: $(wc -c < tools/logs-latest.json) bytes"
      - name: Commit als er iets veranderd is
        run: |
          git config user.name "logboek-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/logs-latest.json
          git diff --cached --quiet || git commit -m "logboek: verse fouten- en liedlogs voor de nachtelijke update"
          git push
